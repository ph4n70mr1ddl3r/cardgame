[package]
name = "poker-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
argon2 = "0.5"
rand = "0.8"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
